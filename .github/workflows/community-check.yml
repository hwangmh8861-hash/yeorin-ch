name: Community check
on:
  pull_request:
    paths:
      - 'community.js'
      - 'build.mjs'
      - 'scripts/validate-community.mjs'
      - '.github/workflows/community-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate-community.mjs
      - run: node build.mjs
      - run: test -s dist/index.html
