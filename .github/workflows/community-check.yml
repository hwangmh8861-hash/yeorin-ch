name: Community check
on:
  pull_request:
    paths:
      - 'community.js'
      - 'community-image-fix.js'
      - 'notification-push.js'
      - 'nanum-v2.js'
      - 'nanum-v2-compose-fix.js'
      - 'nanum-range-patch.js'
      - 'bible-provider.js'
      - 'sw.js'
      - 'build.mjs'
      - 'scripts/validate-community.mjs'
      - '.github/workflows/community-check.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check community-image-fix.js
      - run: node --check notification-push.js
      - run: node --check bible-provider.js
      - run: node --check nanum-v2.js
      - run: node --check nanum-v2-compose-fix.js
      - run: node --check nanum-range-patch.js
      - run: node --check sw.js
      - run: node scripts/validate-community.mjs
      - run: node build.mjs
      - run: test -s dist/index.html
      - run: test -s dist/sw.js
