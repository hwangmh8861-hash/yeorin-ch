name: Optimize nanum transition once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-nanum-transition-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining nanum transition work
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) nanum-time-fix: do not invalidate the same day's legacy cache,
          # and do not call renderHero/loadDayPosts a second time after switchTab.
          p=Path('nanum-time-fix.js')
          s=p.read_text(encoding='utf-8')
          old="""    try{if(typeof setStripMonthOf==='function')setStripMonthOf(t);}catch(e){}\n    try{_loadedDate='';}catch(e){}\n    return t;"""
          new="""    try{if(typeof setStripMonthOf==='function')setStripMonthOf(t);}catch(e){}\n    return t;"""
          if old not in s: raise SystemExit('nanum forceToday snippet not found')
          s=s.replace(old,new,1)

          old="""    const r=baseSwitchTab.apply(this,arguments);\n    if(t){\n      try{if(typeof renderHero==='function')renderHero();}catch(e){}\n      try{if(typeof loadDayPosts==='function')loadDayPosts(t,true);}catch(e){}\n    }\n    if(String(id)==='community')scheduleCommunitySync(true);\n    return r;"""
          new="""    const r=baseSwitchTab.apply(this,arguments);\n    // 기본 switchTab이 이미 ensureDayPosts()와 renderAll()을 수행합니다.\n    // 여기서 다시 renderHero/loadDayPosts를 호출하면 같은 전환에서 중복 작업이 발생합니다.\n    if(String(id)==='community')scheduleCommunitySync(true);\n    return r;"""
          if old not in s: raise SystemExit('nanum duplicate switch snippet not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 2) avatar: nanum entry must not trigger a second avatar RPC.
          p=Path('avatar.js')
          s=p.read_text(encoding='utf-8')
          old="""const oldSwitch=window.switchTab;if(typeof oldSwitch==='function')window.switchTab=function(tab){const r=oldSwitch.apply(this,arguments);if(tab==='nanum'||tab==='mypage'||tab==='community')setTimeout(()=>refresh(),80);return r}"""
          new="""const oldSwitch=window.switchTab;if(typeof oldSwitch==='function')window.switchTab=function(tab){const r=oldSwitch.apply(this,arguments);if(tab==='nanum')setTimeout(()=>decorate(),0);else if(tab==='mypage'||tab==='community')setTimeout(()=>refresh(),80);return r}"""
          if old not in s: raise SystemExit('avatar switch snippet not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 3) social-feed: while the social feed is active, skip hidden legacy
          # qt/prayer DOM rendering. Legacy composer still works because it sets
          # state.active=false before rendering the legacy form.
          p=Path('social-feed.js')
          s=p.read_text(encoding='utf-8')
          marker="""/* ---------- 기존 나눔 작성 화면 연동 (유지) ---------- */\nconst oldSwitchNanum=window.switchNanum;"""
          replacement="""/* ---------- 기존 나눔 작성 화면 연동 (유지) ---------- */\n// 소셜 피드가 보이는 동안에는 뒤에서 숨겨진 레거시 나눔/기도 목록까지 다시 그리지 않습니다.\n// 작성 화면으로 들어가면 state.active=false가 되므로 기존 렌더러가 그대로 동작합니다.\nconst socialLegacyRenderQt=window.renderQt;\nif(typeof socialLegacyRenderQt==='function')window.renderQt=function(){\n  if(state.active&&typeof curTab!=='undefined'&&curTab==='nanum')return;\n  return socialLegacyRenderQt.apply(this,arguments)\n};\nconst socialLegacyRenderPrayer=window.renderPrayer;\nif(typeof socialLegacyRenderPrayer==='function')window.renderPrayer=function(){\n  if(state.active&&typeof curTab!=='undefined'&&curTab==='nanum')return;\n  return socialLegacyRenderPrayer.apply(this,arguments)\n};\nconst oldSwitchNanum=window.switchNanum;"""
          if marker not in s: raise SystemExit('social legacy marker not found')
          s=s.replace(marker,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript and build
        run: |
          node --check nanum-time-fix.js
          node --check avatar.js
          node --check social-feed.js
          node build.mjs

      - name: Commit optimized transition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nanum-time-fix.js avatar.js social-feed.js
          git commit -m 'perf: remove redundant nanum transition work'
          git push
