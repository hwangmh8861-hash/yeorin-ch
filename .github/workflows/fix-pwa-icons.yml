name: Fix PWA icons
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-encode all install icons as standard PNG
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('icons/icon-1024.png')
          im = Image.open(src)
          im.load()
          im = im.convert('RGB')
          print('SOURCE', src, im.size, im.mode)

          targets = {
            'favicon-32.png': 32,
            'apple-touch-icon.png': 180,
            'icon-192.png': 192,
            'icon-512.png': 512,
            'icon-maskable-512.png': 512,
            'icons/favicon-16.png': 16,
            'icons/favicon-32.png': 32,
            'icons/icon-120.png': 120,
            'icons/icon-152.png': 152,
            'icons/icon-180.png': 180,
            'icons/icon-192.png': 192,
            'icons/icon-512.png': 512,
          }
          for path, size in targets.items():
            out = Path(path)
            out.parent.mkdir(parents=True, exist_ok=True)
            resized = im.resize((size, size), Image.Resampling.LANCZOS)
            resized.save(out, format='PNG', optimize=False, compress_level=6)
            check = Image.open(out)
            check.load()
            assert check.size == (size, size)
            assert check.format == 'PNG'
            print('WROTE', path, check.size, check.mode, out.stat().st_size)
          PY
      - name: Bump service worker cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text()
          s=s.replace("const CACHE='yeorin-shell-v9';", "const CACHE='yeorin-shell-v10';")
          p.write_text(s)
          PY
      - name: Verify PNG files
        run: |
          file icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-32.png
          python - <<'PY'
          from PIL import Image
          for p in ['icon-192.png','icon-512.png','icon-maskable-512.png','apple-touch-icon.png','favicon-32.png']:
              im=Image.open(p); im.verify(); print('VALID',p)
          PY
      - name: Commit repaired icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png favicon-32.png icons/ sw.js
          git commit -m 'fix: re-encode PWA icons for Chrome WebAPK installability'
          git push
