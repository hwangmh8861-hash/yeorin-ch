name: Optimize nanum feed once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-nanum-feed-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant nanum tab reload work
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('social-feed.js')
          s=p.read_text(encoding='utf-8')

          old="let seen=new Set(),io=null;"
          new="let seen=new Set(),io=null,feedLoadedAt=0,auxLoadedAt=0;\nconst FEED_TTL=30*1000,AUX_TTL=5*60*1000;"
          assert old in s
          s=s.replace(old,new,1)

          start=s.index('async function load(reset){')
          end=s.index('function busy(on){',start)
          new_load=r'''async function load(reset,opts){
  opts=opts||{};
  if(state.loading)return;
  const now=Date.now();

  if(reset&&!opts.force&&feedLoadedAt&&now-feedLoadedAt<FEED_TTL){
    const r=ensureRoot();
    if(r){
      r.style.display='block';
      if(!r.querySelector('.ys-feed'))render();
      else syncObserver();
    }
    return;
  }

  if(reset)state.page=0;
  state.loading=true;
  if(reset&&!root())ensureRoot();

  const hasVisibleFeed=!!(reset&&state.posts.length&&root()&&root().querySelector('.ys-feed'));
  if(reset&&!hasVisibleFeed)render();
  else if(!reset)busy(true);

  try{
    const wantAux=!!opts.aux||!auxLoadedAt||now-auxLoadedAt>=AUX_TTL;
    const tasks=[rpc('yeorin_social_feed',{p_kind:state.kind,p_author_ids:state.authors.length?state.authors:null,p_page:state.page,p_per_page:15,p_date:state.date||null})];
    if(reset&&wantAux){
      tasks.push(rpc('yeorin_story_feed',{}));
      tasks.push(rpc('yeorin_avatars',{}).catch(()=>null));
    }

    const res=await Promise.all(tasks),f=res[0]||{},incoming=f.posts||[];
    if(reset&&wantAux){
      state.stories=res[1]||[];
      if(res[2]&&window.YeorinAvatar)YeorinAvatar.applyMap(res[2]);
      auxLoadedAt=Date.now();
    }
    state.hasMore=!!f.hasMore;

    if(reset){
      state.posts=incoming;
      feedLoadedAt=Date.now();
      seen=new Set(incoming.map(pkey));
      render();
    }else{
      const fresh=incoming.filter(p=>!seen.has(pkey(p)));
      fresh.forEach(p=>seen.add(pkey(p)));
      state.posts=state.posts.concat(fresh);
      appendPosts(fresh);
      if(!fresh.length&&incoming.length)state.hasMore=false;
    }
  }catch(e){
    console.error('[social feed]',e);
    if(!reset)state.page=Math.max(0,state.page-1);
    if(typeof showToast==='function')showToast('나눔 피드를 불러오지 못했어요','error');
  }finally{
    state.loading=false;
    busy(false);
    syncObserver();
  }
}
'''
          s=s[:start]+new_load+s[end:]

          replacements={
            "window.socialKind=k=>{if(state.kind===k)return;state.kind=k;load(true)};":"window.socialKind=k=>{if(state.kind===k)return;state.kind=k;load(true,{force:true,aux:false})};",
            "window.socialPerson=id=>{const a=id?[id]:[];if(a.length===state.authors.length&&a.every(x=>state.authors.indexOf(x)>=0))return;state.authors=a;load(true)};":"window.socialPerson=id=>{const a=id?[id]:[];if(a.length===state.authors.length&&a.every(x=>state.authors.indexOf(x)>=0))return;state.authors=a;load(true,{force:true,aux:false})};",
            "window.socialDate=v=>{const d=v||'';if(state.date===d)return;state.date=d;load(true)};":"window.socialDate=v=>{const d=v||'';if(state.date===d)return;state.date=d;load(true,{force:true,aux:false})};",
            "  if(same){render();return Promise.resolve()}\n  return load(true)":"  if(same){syncObserver();return Promise.resolve()}\n  return load(true,{force:true,aux:false})",
            "window.refreshSocialFeed=()=>load(true);":"window.refreshSocialFeed=()=>load(true,{force:true,aux:true});",
            "  if(same){render();return}\n  load(true)":"  if(same){syncObserver();return}\n  load(true,{force:true,aux:false})",
            "  state.kind='all';state.date='';state.authors=[];load(true)":"  state.kind='all';state.date='';state.authors=[];load(true,{force:true,aux:false})",
            "window.returnSocialFeed=function(){state.active=true;const r=ensureRoot();r.style.display='block';load(true)};":"window.returnSocialFeed=function(){state.active=true;const r=ensureRoot();r.style.display='block';load(true,{force:true,aux:false})};",
            "const oldSwitchTab=window.switchTab;if(typeof oldSwitchTab==='function')window.switchTab=function(tab){const r=oldSwitchTab.apply(this,arguments);if(tab==='nanum'){state.active=true;setTimeout(()=>{ensureRoot();root().style.display='block';load(true)},0)}else if(io)io.disconnect();return r};":"const oldSwitchTab=window.switchTab;if(typeof oldSwitchTab==='function')window.switchTab=function(tab){const r=oldSwitchTab.apply(this,arguments);if(tab==='nanum'){state.active=true;const socialRoot=ensureRoot();if(socialRoot)socialRoot.style.display='block';setTimeout(()=>load(true,{force:false,aux:false}),0)}else if(io)io.disconnect();return r};",
            "    await load(true)":"    await load(true,{force:true,aux:true})",
            "setTimeout(()=>{if(typeof curTab!=='undefined'&&curTab==='nanum'){ensureRoot();load(true)}},700);":"setTimeout(()=>{if(typeof curTab!=='undefined'&&curTab==='nanum'){ensureRoot();load(true,{force:false,aux:true})}},700);"
          }
          for a,b in replacements.items():
            if a not in s:
              raise SystemExit('missing expected snippet: '+a[:100])
            s=s.replace(a,b,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check social-feed.js

      - name: Commit optimized feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social-feed.js
          git commit -m 'perf: make nanum tab reuse cached feed and reduce RPCs'
          git push
