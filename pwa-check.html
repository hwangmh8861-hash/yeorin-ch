<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>여린교회 PWA 진단</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2F6B47">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f5f3;color:#17231b;font-family:system-ui,-apple-system,'Pretendard',sans-serif}.wrap{max-width:640px;margin:0 auto;padding:24px 18px 48px}.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 4px 18px rgba(0,0,0,.06)}h1{font-size:24px;margin:4px 0 8px}p{line-height:1.55;color:#5c675f}.row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #edf0ed}.row:last-child{border-bottom:0}.dot{width:11px;height:11px;border-radius:50%;margin-top:5px;background:#b8bdb9;flex:0 0 auto}.ok .dot{background:#2f8b54}.bad .dot{background:#d64b42}.wait .dot{background:#d6a12f}.label{font-weight:750}.detail{font-size:13px;color:#6f7972;word-break:break-all;margin-top:3px}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:800;margin-top:10px;background:#2F6B47;color:white}.btn:disabled{background:#aab3ad}.ghost{background:#e8f1eb;color:#245b3b}code{background:#f2f4f2;padding:2px 5px;border-radius:5px}.summary{font-size:18px;font-weight:800}.small{font-size:12px;color:#7a837d}
  </style>
</head>
<body>
<div class="wrap">
  <h1>여린교회 PWA 진단</h1>
  <p>이 화면은 Chrome이 여린교회를 설치형 PWA로 인식하는지 직접 확인합니다.</p>
  <div class="card" id="summary"><div class="summary">진단 중...</div></div>
  <div class="card" id="checks"></div>
  <button class="btn" id="installBtn" disabled>설치 가능 여부 확인 중...</button>
  <button class="btn ghost" id="refreshBtn">서비스워커 갱신 후 다시 검사</button>
  <button class="btn ghost" id="copyBtn">진단 결과 복사</button>
  <p class="small">설치 버튼이 활성화되면 Chrome이 이 사이트를 설치 가능한 PWA로 판정한 상태입니다.</p>
</div>
<script>
(() => {
  'use strict';
  const checks=[];
  let deferredPrompt=null;
  const $=id=>document.getElementById(id);
  function add(name,status,detail){checks.push({name,status,detail:String(detail??'')});render();}
  function set(name,status,detail){const x=checks.find(v=>v.name===name);if(x){x.status=status;x.detail=String(detail??'')}else checks.push({name,status,detail:String(detail??'')});render();}
  function render(){
    $('checks').innerHTML=checks.map(x=>`<div class="row ${x.status}"><span class="dot"></span><div><div class="label">${x.name}</div><div class="detail">${x.detail}</div></div></div>`).join('');
    const bad=checks.filter(x=>x.status==='bad').length, wait=checks.filter(x=>x.status==='wait').length;
    $('summary').innerHTML=`<div class="summary">${bad?`문제 ${bad}개 발견`:(wait?'설치 판정 대기 중':'기본 PWA 조건 정상')}</div><p>${bad?'빨간 항목을 확인해야 합니다.':(deferredPrompt?'Chrome 설치 프롬프트가 확인됐습니다.':'아래 설치 판정 결과까지 확인해주세요.')}</p>`;
  }

  add('HTTPS / 보안 컨텍스트', location.protocol==='https:'?'ok':'bad', `${location.protocol} / secureContext=${window.isSecureContext}`);
  add('standalone 실행 여부', matchMedia('(display-mode: standalone)').matches?'ok':'wait', matchMedia('(display-mode: standalone)').matches?'이미 standalone으로 실행 중':'현재 Chrome 탭에서 실행 중');
  add('manifest 연결', document.querySelector('link[rel="manifest"]')?'ok':'bad', document.querySelector('link[rel="manifest"]')?.href || 'manifest link 없음');
  add('manifest 응답','wait','확인 중');
  add('manifest 필수값','wait','확인 중');
  add('192 / 512 아이콘','wait','확인 중');
  add('서비스워커 등록','wait','확인 중');
  add('서비스워커 페이지 제어','wait','확인 중');
  add('Chrome 설치 프롬프트','wait','beforeinstallprompt 대기 중');

  async function checkManifest(){
    try{
      const r=await fetch('/manifest.json?diag='+Date.now(),{cache:'no-store'});
      const ct=r.headers.get('content-type')||'';
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      const m=await r.json();
      set('manifest 응답','ok',`HTTP ${r.status} / ${ct}`);
      const inScope=(m.start_url||'').startsWith(m.scope||'/') || ((m.scope||'/')==='/' && (m.start_url||'/').startsWith('/'));
      const displayOk=['standalone','fullscreen','minimal-ui','window-controls-overlay','tabbed'].includes(m.display);
      const required=!!(m.name||m.short_name) && !!m.start_url && inScope && displayOk;
      set('manifest 필수값',required?'ok':'bad',`name=${m.name||m.short_name||'없음'}, start_url=${m.start_url}, scope=${m.scope}, display=${m.display}, start_url∈scope=${inScope}`);
      const i192=(m.icons||[]).find(i=>String(i.sizes||'').split(/\s+/).includes('192x192'));
      const i512=(m.icons||[]).find(i=>String(i.sizes||'').split(/\s+/).includes('512x512'));
      let iconDetail=[]; let iconOk=!!i192&&!!i512;
      for(const [size,icon] of [['192',i192],['512',i512]]){
        if(!icon){iconDetail.push(`${size}: manifest 없음`);continue;}
        try{const rr=await fetch(icon.src+'?diag='+Date.now(),{cache:'no-store'});iconOk=iconOk&&rr.ok;iconDetail.push(`${size}: ${icon.src} HTTP ${rr.status}`)}catch(e){iconOk=false;iconDetail.push(`${size}: ${e.message}`)}
      }
      set('192 / 512 아이콘',iconOk?'ok':'bad',iconDetail.join(' / '));
    }catch(e){set('manifest 응답','bad',e.message);set('manifest 필수값','bad','manifest를 읽지 못함');set('192 / 512 아이콘','bad','manifest를 읽지 못함');}
  }

  async function checkSW(force){
    if(!('serviceWorker' in navigator)){set('서비스워커 등록','bad','이 브라우저는 service worker 미지원');set('서비스워커 페이지 제어','bad','미지원');return;}
    try{
      let reg=await navigator.serviceWorker.getRegistration('/');
      if(!reg || force) reg=await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});
      if(force) await reg.update();
      set('서비스워커 등록','ok',`scope=${reg.scope} / active=${!!reg.active} / waiting=${!!reg.waiting} / installing=${!!reg.installing}`);
      if(navigator.serviceWorker.controller){set('서비스워커 페이지 제어','ok',navigator.serviceWorker.controller.scriptURL)}
      else {set('서비스워커 페이지 제어','wait','등록은 됐지만 현재 페이지 controller 없음. 새로고침 후 다시 확인하세요.');}
    }catch(e){set('서비스워커 등록','bad',e.message);set('서비스워커 페이지 제어','bad','등록 실패');}
  }

  window.addEventListener('beforeinstallprompt', e=>{
    e.preventDefault(); deferredPrompt=e;
    set('Chrome 설치 프롬프트','ok','beforeinstallprompt 발생 — 설치 가능한 PWA로 판정됨');
    $('installBtn').disabled=false;$('installBtn').textContent='여린교회 앱 설치';
  });
  window.addEventListener('appinstalled',()=>{set('Chrome 설치 프롬프트','ok','앱 설치 완료');$('installBtn').disabled=true;$('installBtn').textContent='설치 완료';});

  $('installBtn').onclick=async()=>{if(!deferredPrompt)return;await deferredPrompt.prompt();const c=await deferredPrompt.userChoice;set('Chrome 설치 프롬프트',c.outcome==='accepted'?'ok':'wait',`사용자 선택: ${c.outcome}`);deferredPrompt=null;$('installBtn').disabled=true;$('installBtn').textContent='설치 프롬프트 사용 완료';};
  $('refreshBtn').onclick=async()=>{await checkSW(true);location.reload();};
  $('copyBtn').onclick=async()=>{const text=['여린교회 PWA 진단',...checks.map(x=>`[${x.status}] ${x.name}: ${x.detail}`)].join('\n');try{await navigator.clipboard.writeText(text);$('copyBtn').textContent='복사 완료';}catch(e){prompt('아래 내용을 복사해주세요',text)}};

  Promise.all([checkManifest(),checkSW(false)]).then(()=>{
    setTimeout(()=>{
      if(!deferredPrompt){
        const installed=matchMedia('(display-mode: standalone)').matches;
        set('Chrome 설치 프롬프트',installed?'ok':'bad',installed?'이미 standalone으로 실행 중':'5초 내 beforeinstallprompt가 발생하지 않음 — Chrome이 현재 이 페이지를 설치 가능한 PWA로 판정하지 않았거나 이미 설치/차단 상태일 수 있음');
        $('installBtn').textContent=installed?'이미 설치됨':'설치 프롬프트 없음';
      }
    },5000);
  });
})();
</script>
</body>
</html>
