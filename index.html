<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>여린교회 신앙관리</title>
<!-- PWA 설정 -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2F6B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여린교회">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<!-- GAS API URL -->
<script>
  window.GAS_URL = 'https://script.google.com/macros/s/AKfycbz30pVwl4DdXvlKgj6mG_YhQlkjxI5SbG5kYycLmU9ESX7f-YA8JHFVHxNt7wa2WYfN/exec';
</script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* ============================================================
   여린교회 디자인 시스템 v2
   - 상단 컬러 블록(hero) + 흰 시트가 라운드로 올라오는 구조
   - 카드는 순백 / 큰 라운드 / 옅은 그림자
   - 초록은 강조에만 사용
   ============================================================ */
:root{
  /* 브랜드 */
  --brand:#2F6B47;        /* 진한 초록 */
  --brand2:#3E8659;       /* 중간 초록 */
  --brand3:#57A176;       /* 밝은 초록 */
  --brand-soft:#E7F2EB;   /* 아주 옅은 초록 배경 */
  --accent:#A9DCC0;       /* hero 위 보조 텍스트 */

  /* 중성 */
  --bg:#F3F5F3;
  --card:#FFFFFF;
  --ink:#1A2620;          /* 제목 */
  --ink2:#586359;         /* 본문 */
  --ink3:#98A29B;         /* 보조/설명 */
  --line:#EDF0EC;
  --line2:#E2E7E2;

  /* 상태 */
  --red:#C9564A;
  --blue:#3B72C4;
  --gold:#C79A3C;
  --purple:#7D6BB0;

  /* 하위호환 (기존 코드가 쓰는 변수명) */
  --b9:var(--ink); --b7:var(--brand2); --b5:var(--ink3);
  --b3:var(--line2); --b1:var(--line); --b0:#F7F9F7;
  --deep:var(--brand); --green:var(--brand2); --coral:var(--red);

  --shadow:0 1px 2px rgba(26,38,32,.04),0 6px 18px rgba(26,38,32,.05);
  --shadow-sm:0 1px 2px rgba(26,38,32,.05);
  --r:20px;
  --max:640px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard Variable','Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;color:var(--ink);-webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.6;overflow-x:hidden;overscroll-behavior-y:contain;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}

/* ===== 온보딩 ===== */
.onboarding{position:fixed;inset:0;z-index:1000;background:var(--bg);}
.ob-slides{display:flex;width:400%;height:100%;transition:transform .4s;}
.ob-slide{width:25%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;}
.ob-icon{font-size:56px;margin-bottom:16px;}
.ob-title{font-size:21px;font-weight:800;color:var(--ink);margin-bottom:8px;letter-spacing:-.5px;}
.ob-desc{font-size:14px;color:var(--ink3);line-height:1.7;max-width:300px;}
.ob-dots{display:flex;gap:8px;margin-top:28px;}
.ob-dot{width:8px;height:8px;border-radius:50%;background:var(--line2);transition:.3s;}
.ob-dot.active{background:var(--brand2);width:24px;border-radius:4px;}
.ob-btns{margin-top:20px;display:flex;gap:12px;}
.ob-btn{padding:12px 28px;border-radius:14px;border:none;font-size:14px;font-weight:700;}
.ob-skip{background:0;color:var(--ink3);}
.ob-next{background:var(--brand2);color:#fff;}
.ob-start{background:var(--brand);color:#fff;padding:15px 44px;font-size:15px;}

/* ===== 로그인 / 회원가입 ===== */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-box{background:var(--card);border-radius:26px;padding:32px 24px;max-width:360px;width:100%;box-shadow:0 8px 32px rgba(26,38,32,.08);text-align:center;}
.auth-box h1{font-size:20px;font-weight:800;color:var(--ink);margin-bottom:2px;letter-spacing:-.5px;}
.auth-box .sub{font-size:12px;color:var(--ink3);margin-bottom:20px;}
.auth-toggle{font-size:13px;color:var(--ink3);margin-top:16px;}
.auth-toggle a{color:var(--brand2);font-weight:700;cursor:pointer;text-decoration:none;}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;}
.emoji-opt{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--b0);font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s;}
.emoji-opt.sel{border-color:var(--brand2);background:var(--brand-soft);transform:scale(1.08);}
.error-msg{color:var(--red);font-size:12px;margin-top:6px;min-height:16px;}

/* ============================================================
   앱 뼈대: hero(컬러) + sheet(흰 영역)
   ============================================================ */
.app{display:none;}

.hero{background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;padding:14px 0 34px;position:relative;}
.hero-inner{max-width:var(--max);margin:0 auto;padding:0 20px;}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.hero-logo{display:flex;align-items:center;gap:8px;cursor:pointer;}
.hero-logo img{height:38px;object-fit:contain;}
.hero-btns{display:flex;align-items:center;gap:8px;}
.hero-btn{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;backdrop-filter:blur(8px);transition:.15s;}
.hero-btn:active{background:rgba(255,255,255,.3);}
.hero-dot{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#FF7A6B;border:1.5px solid var(--brand);}

.hero-title{font-size:26px;font-weight:900;letter-spacing:-1px;line-height:1.28;margin-top:12px;}
.hero-sub{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.4px;}
.hero-desc{font-size:13px;color:var(--accent);font-weight:600;margin-top:5px;}

.sheet{background:var(--bg);border-radius:26px 26px 0 0;margin-top:-24px;position:relative;z-index:2;min-height:60vh;}
.content{max-width:var(--max);margin:0 auto;padding:22px 20px 110px;}
.page{display:none;animation:fadeUp .22s;}
.page.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(min-width:1024px){:root{--max:720px;}}

/* ===== 하단 탭바 ===== */
.bottom-bar{position:fixed;bottom:14px;left:14px;right:14px;background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:24px;box-shadow:0 6px 24px rgba(26,38,32,.1);z-index:200;padding:7px;max-width:calc(var(--max) - 28px);margin:0 auto;backdrop-filter:blur(12px);}
.bottom-inner{display:flex;}
.btab{flex:1;padding:9px 0;border:none;background:none;font-size:11px;color:#A8B2AA;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;transition:.2s;border-radius:18px;font-weight:700;letter-spacing:-.2px;}
.btab.active{color:#fff;background:var(--brand);}
.btab .bico{font-size:20px;line-height:1;}
.badge{position:absolute;top:4px;right:calc(50% - 22px);background:#FF7A6B;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}

/* ===== 사이드 메뉴 ===== */
.side-menu-overlay{position:fixed;inset:0;background:rgba(20,30,24,.45);z-index:550;opacity:0;pointer-events:none;transition:opacity .25s;}
.side-menu-overlay.open{opacity:1;pointer-events:auto;}
.side-menu{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:300px;background:var(--card);z-index:551;transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.7,.3,1);box-shadow:6px 0 28px rgba(0,0,0,.16);display:flex;flex-direction:column;}
.side-menu.open{transform:translateX(0);}
.side-menu-hdr{padding:28px 22px 22px;background:linear-gradient(160deg,var(--brand),var(--brand2));color:#fff;}
.side-menu-hdr .smh-title{font-size:19px;font-weight:900;letter-spacing:-.5px;}
.side-menu-hdr .smh-sub{font-size:12px;color:var(--accent);font-weight:600;margin-top:3px;}
.side-menu-list{flex:1;overflow-y:auto;padding:10px 0;}
.side-menu-item{display:flex;align-items:center;gap:14px;padding:16px 22px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:15px;font-weight:600;color:var(--ink);transition:.15s;font-family:inherit;}
.side-menu-item:active{background:var(--brand-soft);}
.side-menu-item .smi-icon{font-size:21px;width:28px;text-align:center;flex-shrink:0;}
.side-menu-item .smi-arrow{margin-left:auto;color:var(--line2);font-size:14px;}
.side-menu-divider{height:1px;background:var(--line);margin:8px 22px;}
.side-menu-foot{padding:16px 22px;font-size:11px;color:var(--ink3);text-align:center;border-top:1px solid var(--line);}

/* ============================================================
   메인홈 타일
   ============================================================ */
.tile-featured{background:linear-gradient(150deg,var(--brand),var(--brand2));color:#fff;border-radius:24px;padding:24px 22px;margin-bottom:14px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;box-shadow:0 6px 20px rgba(47,107,71,.22);}
.tile-featured:active{transform:scale(.985);}
.tile-featured::after{content:'';position:absolute;top:-50px;right:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07);}
.tile-featured .tf-icon{font-size:34px;margin-bottom:12px;line-height:1;position:relative;z-index:1;}
.tile-featured .tf-title{font-size:20px;font-weight:900;letter-spacing:-.6px;position:relative;z-index:1;}
.tile-featured .tf-sub{font-size:12.5px;color:var(--accent);font-weight:600;margin-top:4px;position:relative;z-index:1;}
.tile-featured .tf-arrow{position:absolute;right:20px;top:22px;font-size:17px;color:rgba(255,255,255,.75);z-index:1;}

.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{background:var(--card);border-radius:22px;padding:20px 18px 18px;cursor:pointer;transition:.18s;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:flex-start;aspect-ratio:1/.92;justify-content:space-between;}
.tile:active{transform:scale(.97);}
.tile .t-icon{font-size:30px;line-height:1;}
.tile .t-title{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.4px;}
.tile .t-sub{font-size:11.5px;color:var(--ink3);font-weight:600;margin-top:3px;}
.tile .t-badge{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:#FF7A6B;border-radius:8px;padding:1px 7px;margin-left:5px;vertical-align:middle;}

/* ============================================================
   날짜 스트립 (조약돌)
   ============================================================ */
.dstrip{display:flex;align-items:center;gap:6px;margin-top:14px;}
.dstrip-arrow{width:30px;height:30px;flex-shrink:0;border-radius:50%;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.dstrip-arrow:active{background:rgba(255,255,255,.32);}
.dstrip-arrow:disabled{opacity:.25;cursor:default;}
.dstrip-track{flex:1;display:flex;gap:7px;overflow-x:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;padding:2px 0;scrollbar-width:none;}
.dstrip-track::-webkit-scrollbar{display:none;}
.dchip{flex-shrink:0;width:44px;padding:7px 0 8px;border-radius:16px;border:none;background:transparent;color:rgba(255,255,255,.72);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:.15s;position:relative;}
.dchip .dc-dow{font-size:10px;font-weight:700;letter-spacing:.2px;opacity:.8;}
.dchip .dc-day{font-size:16px;font-weight:800;letter-spacing:-.4px;}
.dchip .dc-mark{width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:1px;}
.dchip .dc-mark.hidden{background:transparent;}
.dchip.sat .dc-dow{color:#A9CDF5;}
.dchip.sun .dc-dow{color:#F5B3AA;}
.dchip.today{background:rgba(255,255,255,.16);}
.dchip.sel{background:#fff;color:var(--brand);}
.dchip.sel .dc-dow{opacity:1;color:var(--brand2);}
.dchip.sel.sat .dc-dow{color:var(--blue);}
.dchip.sel.sun .dc-dow{color:var(--red);}
.dchip.sel .dc-mark{background:var(--brand3);}
.dstrip-today{margin-top:10px;display:flex;justify-content:center;}
.dstrip-today button{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:11.5px;font-weight:700;padding:6px 16px;border-radius:999px;cursor:pointer;}

/* ============================================================
   공통 컴포넌트
   ============================================================ */
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);}
.sec-title{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.4px;margin-bottom:10px;padding:0 2px;}
.sec-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 2px;}
.sec-more{background:var(--brand-soft);border:none;color:var(--brand2);font-size:11.5px;font-weight:700;padding:6px 13px;border-radius:999px;cursor:pointer;}

.btn-primary{padding:14px 26px;border-radius:15px;border:none;background:var(--brand2);color:#fff;font-size:15px;font-weight:700;letter-spacing:-.2px;}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-full{width:100%;padding:15px;border-radius:15px;border:none;font-size:15px;font-weight:700;letter-spacing:-.2px;}
.btn-sm{padding:8px 16px;border-radius:11px;border:none;font-size:13px;font-weight:700;}
.btn-dashed{width:100%;padding:16px;border-radius:18px;border:1.5px dashed var(--line2);background:var(--card);color:var(--brand2);font-size:14px;font-weight:700;margin-bottom:14px;letter-spacing:-.2px;}
.btn-pill{padding:8px 16px;border-radius:999px;border:none;font-size:13px;font-weight:700;transition:.15s;}
.btn-more{width:100%;padding:14px;border-radius:15px;border:none;background:var(--card);color:var(--ink3);font-size:13px;font-weight:700;margin-top:10px;box-shadow:var(--shadow-sm);}

.input-field{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);font-size:15px;outline:none;background:var(--b0);transition:.15s;color:var(--ink);}
.input-field:focus{border-color:var(--brand3);background:#fff;}
.select-field{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);font-size:15px;outline:none;background:var(--b0);cursor:pointer;appearance:none;color:var(--ink);}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;background:var(--brand-soft);}
.fg{margin-bottom:15px;}
.q-label{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:7px;display:block;letter-spacing:-.2px;}

.back-btn{background:none;border:none;color:var(--brand2);font-size:14px;font-weight:700;margin-bottom:14px;padding:6px 0;cursor:pointer;}

.sub-tabs{display:flex;background:var(--line);border-radius:16px;padding:4px;margin-bottom:16px;}
.sub-tab{flex:1;padding:11px 6px;border:none;border-radius:13px;background:0;font-size:13.5px;font-weight:700;color:var(--ink3);transition:.2s;text-align:center;letter-spacing:-.2px;position:relative;}
.sub-tab.active{background:var(--card);color:var(--brand);font-weight:800;box-shadow:0 2px 6px rgba(26,38,32,.07);}

.filter-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.filter-tab{padding:9px 17px;border-radius:999px;border:none;font-size:13px;font-weight:700;transition:.15s;letter-spacing:-.2px;}
.filter-tab.active{background:var(--brand);color:#fff;}
.filter-tab:not(.active){background:var(--card);color:var(--ink2);box-shadow:var(--shadow-sm);}

/* ===== 공감 / 댓글 ===== */
.reaction-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;}
.react-btn{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;transition:.15s;display:flex;align-items:center;gap:4px;font-weight:600;color:var(--ink2);}
.react-btn.active{border-color:var(--brand3);background:var(--brand-soft);color:var(--brand);font-weight:700;}
.react-btn .cnt{font-size:12px;font-weight:800;color:var(--ink3);}
.react-btn.active .cnt{color:var(--brand2);}
.rx-names{font-size:12px;color:var(--ink3);margin-top:7px;line-height:1.5;}
.comment-section{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;}
.c-item{display:flex;gap:8px;margin-bottom:7px;}
.c-av{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.c-body{font-size:13.5px;color:var(--ink2);line-height:1.55;white-space:pre-wrap;}
.c-name{font-weight:700;margin-right:4px;color:var(--ink);}
.c-date{font-size:11px;color:var(--ink3);margin-left:5px;}
.c-del{border:none;background:none;color:var(--ink3);font-size:11px;margin-left:4px;text-decoration:underline;}
.c-input-row{display:flex;gap:6px;margin-top:8px;}
.c-input-row input{flex:1;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);font-size:13px;outline:none;background:var(--b0);}
.c-input-row button{padding:10px 18px;border-radius:999px;border:none;background:var(--brand2);color:#fff;font-size:12px;font-weight:700;}

/* ===== QT 본문 ===== */
.qt-block{margin-bottom:12px;}
.qt-label{font-size:11.5px;font-weight:800;color:var(--ink3);margin-bottom:4px;letter-spacing:.2px;}
.qt-text{font-size:14.5px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;}
.qt-verse{display:inline-block;font-size:12px;font-weight:800;color:var(--brand2);background:var(--brand-soft);padding:5px 12px;border-radius:999px;margin-bottom:12px;}

/* ===== 팝업 ===== */
.overlay{position:fixed;inset:0;background:rgba(20,30,24,.48);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.popup{background:#fff;border-radius:24px;width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:26px 24px;box-shadow:0 14px 44px rgba(0,0,0,.18);position:relative;}
.popup-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;border:none;background:var(--line);font-size:14px;display:flex;align-items:center;justify-content:center;}
.popup h3{font-size:18px;font-weight:800;margin-bottom:16px;letter-spacing:-.4px;}

/* ===== 로딩 ===== */
.loading{text-align:center;padding:36px;color:var(--ink3);font-size:14px;}
.load-wrap{position:relative;min-height:400px;padding-top:6px;}
.load-skeleton{pointer-events:none;}
.sk-box{background:linear-gradient(90deg,rgba(230,236,230,.6) 25%,rgba(245,248,245,.9) 50%,rgba(230,236,230,.6) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:10px;display:block;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.load-verse{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100%,320px);background:linear-gradient(150deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:28px 24px 24px;box-shadow:0 12px 32px rgba(47,107,71,.24);animation:verseIn .5s ease-out;z-index:2;}
@keyframes verseIn{from{opacity:0;transform:translate(-50%,-40%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.load-verse-label{font-size:10px;letter-spacing:2.5px;font-weight:800;color:var(--accent);margin-bottom:12px;text-align:center;}
.load-verse-text{font-size:16px;line-height:1.75;font-weight:500;text-align:center;margin-bottom:14px;min-height:48px;}
.load-verse-ref{font-size:11px;color:var(--accent);font-weight:800;text-align:center;margin-bottom:18px;}
.load-verse-dots{display:flex;justify-content:center;gap:6px;}

/* ===== 토스트 ===== */

.toast .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite;}
.toast.success .dot{background:#7ADD9D;animation:none;}
.toast.error{background:var(--red);}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* ===== 진행바 ===== */
.progress-bar-bg{background:var(--line);border-radius:999px;height:9px;overflow:hidden;}

.cat-group{background:var(--card);border-radius:18px;padding:14px 14px 12px;margin-bottom:10px;box-shadow:var(--shadow-sm);}

.accordion-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:4px 0;font-size:15px;font-weight:800;letter-spacing:-.3px;}

.cat-tab{padding:7px 14px;border-radius:999px;border:none;font-size:12.5px;font-weight:700;transition:.15s;}

/* ===== 드롭다운 ===== */

.my-menu-item:last-child{border-bottom:none;}
.my-menu-item .mi-icon{font-size:19px;width:26px;text-align:center;}

/* ===== 오늘의 말씀 ===== */
.verse-card{background:var(--card);border-radius:22px;padding:26px 22px;text-align:center;margin-bottom:14px;box-shadow:var(--shadow);animation:fadeIn .4s;}

.ico{display:inline-block;vertical-align:-.18em;flex-shrink:0;}
.icon-box{display:flex;align-items:center;justify-content:center;flex-shrink:0;}

   주소록

// ico('book') 또는 ico('book',22) / ico('book',22,'#fff')
function ico(name,size,color){
  const p=ICO[name];
  if(!p)return '';
  const s=size||20;
  return '<svg class="ico" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="'+(color||'currentColor')+'" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}

// 유틸 함수
const pd=n=>String(n).padStart(2,'0');
function td(){const d=new Date();return d.getFullYear()+'-'+pd(d.getMonth()+1)+'-'+pd(d.getDate());}
// yyyy-MM-dd 문자열에 일수를 더해 새 날짜 문자열 반환
function addDays(ds,n){
  const p=String(ds).split('-');
  const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pd(d.getMonth()+1)+'-'+pd(d.getDate());
}
// 해당 날짜가 속한 주의 월요일
function weekStart(ds){
  const p=String(ds).split('-');
  const d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  const dow=(d.getDay()+6)%7; // 월=0
  return addDays(ds,-dow);
}
function dowOf(ds){
  const p=String(ds).split('-');
  return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).getDay();
}
const DOW_KR=['일','월','화','수','목','금','토'];
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function gm(uid){if(!AD)return{name:'?',emoji:'🙂'};return AD.users.find(x=>x.id===String(uid))||{name:'?',emoji:'🙂'};}

function randomVerse(){return VERSES[Math.floor(Math.random()*VERSES.length)];}

function getYoutubeId(url){
  if(!url)return'';
  const m=String(url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([^&?#/]+)/);
  return m?m[1]:'';
}
function getYoutubeThumb(url){
  const id=getYoutubeId(url);
  return id?'https://img.youtube.com/vi/'+id+'/mqdefault.jpg':'';
}

function gas(fn,...a){
  return fetch(window.GAS_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({fn:fn,args:a})
  }).then(function(res){
    if(!res.ok)throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(r){
    if(r.error)throw new Error(r.error);
    return r.data;
  });
}

async function tryAuto(){

  // 저장된 정보가 없으면 → 온보딩 또는 로그인 화면 표시
  if(!s){
    document.getElementById('splash').style.display='none';

    if(obSeen){
      document.getElementById('loginScreen').style.display='flex';
    }else{
      document.getElementById('onboarding').style.display='block';
    }
    return;
  }
  // 저장된 정보가 있으면 → 자동 로그인 시도
  setSplashMsg('자동 로그인 중...');
  try{
    const d=JSON.parse(s);
    document.getElementById('loginName').value=d.name;
    document.getElementById('loginPw').value=d.pw;
    const r=await gas('loginUser',String(d.name),String(d.pw));
    if(r.success){
      CU=r.user;
      setSplashMsg('환영합니다, '+r.user.name+'님');
      await enterApp();
      restoreLastTab();
      // 자연스럽게 페이드아웃
      setTimeout(function(){
        const sp=document.getElementById('splash');
        sp.style.transition='opacity .35s';
        sp.style.opacity='0';
        setTimeout(function(){sp.style.display='none';},380);
      },300);
    }else{
      localStorage.removeItem('yeorin_user');
      document.getElementById('splash').style.display='none';
      document.getElementById('loginScreen').style.display='flex';
      document.getElementById('loginBtn').textContent='로그인';
      document.getElementById('loginError').textContent='저장된 정보로 로그인할 수 없어요. 다시 입력해주세요.';
      document.getElementById('loginPw').value='';
    }
  }catch(e){
    localStorage.removeItem('yeorin_user');
    document.getElementById('splash').style.display='none';
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('loginBtn').textContent='로그인';
  }
}

function restoreLastTab(){
  try{
    const t=localStorage.getItem('yeorin_lastTab');
    const at=parseInt(localStorage.getItem('yeorin_lastTabAt')||'0',10);
    const elapsed=Date.now()-at;
    const RESTORE_LIMIT=30*60*1000; // 30분
    // 30분 지났으면 메인홈에서 시작 (복원하지 않음)
    if(!t||!at||elapsed>RESTORE_LIMIT)return;
    // v2에서 사라진 탭(예배/재정/이웃)이 저장돼 있으면 무시
    const VALID=['main','home','bible','nanum','calendar','addressbook'];
    if(VALID.indexOf(t)<0)return;
    if(t!==curTab)switchTab(t);
  }catch(e){}
}

// 글이 있는 날짜를 최신순으로
function datesWithPosts(){
  const set={};
  Object.keys(postDates.qt||{}).forEach(function(d){set[d]=1;});
  Object.keys(postDates.prayer||{}).forEach(function(d){set[d]=1;});
  return Object.keys(set).sort().reverse();
}

function countOn(ds){
  return ((postDates.qt||{})[ds]||0)+((postDates.prayer||{})[ds]||0);
}

// 첫 진입 시 볼 날짜 정하기 — 오늘, 없으면 가장 최근에 글이 있던 날
function initNanumDate(){
  const today=td();
  if(countOn(today)>0){nanumDate=today;}
  else{
    const list=datesWithPosts();
    nanumDate=list.length?list[0]:today;
  }
  stripStart=weekStart(nanumDate);
}

function nanumDateLabel(){
  if(!nanumDate)return '';
  const p=nanumDate.split('-');
  const dow=DOW_KR[dowOf(nanumDate)];
  const isToday=nanumDate===td();
  return Number(p[1])+'월 '+Number(p[2])+'일 ('+dow+')'+(isToday?' · 오늘':'');
}

// 과거로 갈 수 있는 한계 (가장 오래된 글이 있는 날)
function oldestPostDate(){
  const list=datesWithPosts();
  return list.length?list[list.length-1]:td();
}

function renderDateStrip(){
  let chips='';
  for(let i=0;i<7;i++){
    const ds=addDays(stripStart,i);
    const dow=dowOf(ds);
    const cnt=countOn(ds);
    const cls='dchip'
      +(ds===nanumDate?' sel':'')
      +(ds===td()&&ds!==nanumDate?' today':'')
      +(dow===0?' sun':dow===6?' sat':'');
    chips+='<button class="'+cls+'" onclick="selectNanumDate(\''+ds+'\')">'
      +'<span class="dc-dow">'+DOW_KR[dow]+'</span>'
      +'<span class="dc-day">'+Number(ds.split('-')[2])+'</span>'
      +'<span class="dc-mark'+(cnt?'':' hidden')+'"></span>'
      +'</button>';
  }
  // 더 과거에 글이 남아있는지 / 미래로 갈 수 있는지
  const canPrev=addDays(stripStart,-1)>=oldestPostDate()||stripStart>oldestPostDate();
  const canNext=addDays(stripStart,7)<=addDays(td(),7);
  const showToday=nanumDate!==td();

  return '<div class="dstrip">'
    +'<button class="dstrip-arrow" onclick="stripMove(-7)"'+(canPrev?'':' disabled')+'>‹</button>'
    +'<div class="dstrip-track" id="dstripTrack">'+chips+'</div>'
    +'<button class="dstrip-arrow" onclick="stripMove(7)"'+(canNext?'':' disabled')+'>›</button>'
    +'</div>'
    +(showToday?'<div class="dstrip-today"><button onclick="selectNanumDate(\''+td()+'\',true)">오늘로 돌아가기</button></div>':'');
}

function stripMove(n){
  stripStart=addDays(stripStart,n);
  renderHero();
}

function selectNanumDate(ds,resetStrip){
  nanumDate=ds;
  if(resetStrip)stripStart=weekStart(ds);
  renderHero();
  loadDayPosts(ds);
}

// 선택한 날짜의 글이 없으면 불러오기
let _loadedDate='';
function ensureDayPosts(){
  if(_loadedDate!==nanumDate)loadDayPosts(nanumDate);
}

async function loadDayPosts(ds,silent){
  if(dayLoading)return;
  dayLoading=true;
  _loadedDate=ds;
  if(!silent){
    qtPosts=[];prPosts=[];
    if(nanumSub==='qt')renderQt();else renderPrayer();
  }
  try{
    const r=await Promise.all([
      gas('getPostsByDate','qt',ds),
      gas('getPostsByDate','prayer',ds)
    ]);
    if(_loadedDate!==ds){dayLoading=false;return;} // 그 사이 날짜가 바뀌었으면 버림
    qtPosts=(r[0]&&r[0].posts)||[];
    prPosts=(r[1]&&r[1].posts)||[];
    dayLoading=false;
    if(nanumSub==='qt')renderQt();else renderPrayer();
  }catch(e){
    dayLoading=false;
    console.warn('[loadDayPosts]',e);
    if(nanumSub==='qt')renderQt();else renderPrayer();
  }
}

// 글이 추가/삭제되면 스트립의 점 표시도 갱신
function bumpPostDate(type,ds,delta){
  if(!postDates[type])postDates[type]={};
  const v=(postDates[type][ds]||0)+delta;
  if(v>0)postDates[type][ds]=v;else delete postDates[type][ds];
  renderHero();
}


function renderRx(rx,defs,type,id){
  const btns=defs.map(function(r){
    const l=rx[r.k]||[];
    const a=l.includes(CU.id);
    return '<button class="react-btn'+(a?' active':'')+'" onclick="event.stopPropagation();togRx(\''+type+'\',\''+id+'\',\''+r.k+'\')">'+r.e+' '+r.l+(l.length?' <span class="cnt">'+l.length+'</span>':'')+'</button>';
  }).join('');
  const lines=defs.map(function(r){
    const l=rx[r.k]||[];
    if(!l.length)return'';
    return r.e+' '+l.map(function(u){return escapeHtml(gm(u).name);}).join(', ');
  }).filter(function(x){return x;}).join(' · ');
  return '<div class="reaction-row">'+btns+'</div>'+(lines?'<div class="rx-names">'+lines+'</div>':'');
}

async function togRx(type,id,key){
  const arr=type==='qt'?qtPosts:prPosts;
  const it=arr.find(function(x){return x.id===String(id);});
  if(!it)return;
  if(!it.reactions)it.reactions={};
  const wasActive=it.reactions[key]&&it.reactions[key].includes(CU.id);

  if(!it.reactions[key])it.reactions[key]=[];
  const idx=it.reactions[key].indexOf(CU.id);
  if(idx>-1)it.reactions[key].splice(idx,1);
  else it.reactions[key].push(CU.id);
  type==='qt'?renderQt():renderPrayer();

  gas('toggleReaction',type,id,key,CU.id).catch(function(e){
    const idx2=it.reactions[key].indexOf(CU.id);
    if(wasActive){if(idx2===-1)it.reactions[key].push(CU.id);}
    else{if(idx2>-1)it.reactions[key].splice(idx2,1);}
    type==='qt'?renderQt():renderPrayer();
    showToast('공감 저장 실패, 다시 시도해주세요','error');
  });
}

// 댓글 렌더 - c.t 본문은 c-body가 white-space:pre-wrap 가짐 (CSS에서 적용됨)
function renderCm(cm,type,id){
  const items=(cm||[]).map(function(c){
    const m=gm(c.a),own=c.a===CU.id;
    return '<div class="c-item"><div class="c-av">'+m.emoji+'</div><div class="c-body"><span class="c-name">'+escapeHtml(m.name)+'</span>'+escapeHtml(c.t)+'<span class="c-date">'+escapeHtml(c.d||'')+'</span>'+(own?'<button class="c-del" onclick="delCm(\''+c.id+'\',\''+type+'\')">삭제</button>':'')+'</div></div>';
  }).join('');
  return '<div class="comment-section">'+items+'<div class="c-input-row"><input placeholder="댓글..." id="ci-'+type+'-'+id+'"><button onclick="addCm(\''+type+'\',\''+id+'\')">등록</button></div></div>';
}

async function addCm(type,id){
  const inp=document.getElementById('ci-'+type+'-'+id);
  if(!inp||!inp.value.trim())return;
  const t=inp.value.trim();
  const arr=type==='qt'?qtPosts:prPosts;
  const it=arr.find(function(x){return x.id===String(id);});
  if(!it)return;
  const tempId='t'+Date.now();
  if(!it.comments)it.comments=[];
  const tempCmt={id:tempId,a:CU.id,t:t,d:td()};
  it.comments.push(tempCmt);
  inp.value='';
  type==='qt'?renderQt():renderPrayer();
  gas('addComment',type,id,CU.id,t).then(function(res){
    if(res&&res.id){
      const cmt=it.comments.find(function(c){return c.id===tempId;});
      if(cmt)cmt.id=res.id;
    }
  }).catch(function(e){
    it.comments=it.comments.filter(function(c){return c.id!==tempId;});
    type==='qt'?renderQt():renderPrayer();
    showToast('댓글 저장 실패, 다시 시도해주세요','error');
  });
}

async function delCm(cid,type){
  const arr=type==='qt'?qtPosts:prPosts;
  const backup=[];
  arr.forEach(function(p){
    if(p.comments){
      p.comments.forEach(function(c){
        if(c.id===cid)backup.push({postId:p.id,cmt:JSON.parse(JSON.stringify(c))});
      });
    }
  });
  arr.forEach(function(p){if(p.comments)p.comments=p.comments.filter(function(c){return c.id!==cid;});});
  type==='qt'?renderQt():renderPrayer();
  gas('deleteComment',cid,CU.id).catch(function(e){
    backup.forEach(function(b){
      const p=arr.find(function(x){return x.id===b.postId;});
      if(p){if(!p.comments)p.comments=[];p.comments.push(b.cmt);}
    });
    type==='qt'?renderQt():renderPrayer();
    showToast('댓글 삭제 실패, 다시 시도해주세요','error');
  });
}

function renderQt(){
  const el=document.getElementById('page-qt');

async function addQT(){
  const b=document.getElementById('qB').value;
  const cf=document.getElementById('qCF').value.trim();
  const vf=document.getElementById('qVF').value.trim();
  const ct=document.getElementById('qCT').value.trim()||cf;
  const vt=document.getElementById('qVT').value.trim()||vf;
  const bv=document.getElementById('qBV').value.trim();
  const ap=document.getElementById('qAP').value.trim();
  const sh=document.getElementById('qSH').value.trim();
  const qq=document.getElementById('qQQ').value.trim();

  if(!b){showToast('성경 책을 선택해주세요','error');return;}
  if(!cf){showToast('장을 입력해주세요','error');return;}
  if(!ap&&!sh){showToast('적용할 점 또는 나누고 싶은 내용을 입력해주세요','error');return;}

  const btn=document.getElementById('qtSubmitBtn');
  if(btn){btn.disabled=true;btn.textContent='저장 중...';}

  const tempId='temp_'+Date.now();
  const today=td();
  // 글은 항상 오늘 날짜로 저장되므로 보던 날짜가 과거였다면 오늘로 옮겨줍니다
  if(nanumDate!==today){
    nanumDate=today;stripStart=weekStart(today);_loadedDate=today;
    qtPosts=[];prPosts=[];
    renderHero();
    loadDayPosts(today,true);
  }
  const tempPost={id:tempId,authorId:CU.id,book:b,chFrom:cf,chTo:ct,vsFrom:vf||'1',vsTo:vt||vf||'1',bestVerse:bv,applyContent:ap,shareContent:sh,question:qq,date:today,reactions:{},comments:[],_pending:true};
  qtPosts.unshift(tempPost);
  sqf=false;
  renderQt();
  showToast('저장 중...');

  try{
    const r=await gas('addQTPost',CU.id,b,cf,ct,vf||'1',vt||vf||'1',bv,ap,sh,qq);
    const idx=qtPosts.findIndex(function(p){return p.id===tempId;});
    if(idx>=0&&r&&r.id){qtPosts[idx].id=r.id;qtPosts[idx]._pending=false;}
    qtDraft=null;
    bumpPostDate('qt',today,1);
    showToast('저장 완료','success');
    renderQt();
  }catch(e){
    qtPosts=qtPosts.filter(function(p){return p.id!==tempId;});
    // 애써 쓴 내용이 날아가지 않도록 보관했다가 폼에 다시 채웁니다
    qtDraft={b:b,cf:cf,vf:vf,ct:ct,vt:vt,bv:bv,ap:ap,sh:sh,qq:qq};
    sqf=true;
    showToast('저장 실패, 다시 시도해주세요','error');
    renderQt();
  }
}

function renderReading(bpSet){
  if(selBook!==null){
    const bk=BIBLE[selBook];
    const co=CC[bk.cat];
    let chs='';
    const readChs=[];
    for(let i=0;i<bk.c;i++){
      const k=selBook+'-'+i;
      const ir=bpSet.has(k);
      if(ir)readChs.push(i+1);
      const sav=savingChapters[k]?' saving':'';
      chs+='<button class="ch-btn'+sav+'" onclick="toggleCh('+selBook+','+i+')" style="background:'+(ir?co.a:'#F8F5F0')+';color:'+(ir?'#fff':'var(--b5)')+';font-weight:'+(ir?700:400)+'">'+(i+1)+'</button>';
    }

    let rangeStr='아직 없어요';
    if(readChs.length){
      const rng=[];
      let s=readChs[0],e=s;
      for(let j=1;j<readChs.length;j++){
        if(readChs[j]===e+1)e=readChs[j];
        else{rng.push(s===e?s+'장':s+'~'+e+'장');s=readChs[j];e=s;}
      }
      rng.push(s===e?s+'장':s+'~'+e+'장');
      rangeStr=rng.join(', ');
    }
    const rp=Math.round(readChs.length/bk.c*100);

    return '<button class="back-btn" onclick="selBook=null;renderBible()">← 목록</button>'
      +'<div class="card">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">'
      +'<div style="font-size:18px;font-weight:900;letter-spacing:-.5px">'+bk.n+'</div>'
      +'<div style="font-size:18px;font-weight:900;color:var(--brand2);letter-spacing:-.5px">'+rp+'%</div></div>'
      +'<div style="font-size:12.5px;color:var(--ink3);margin-bottom:8px;font-weight:600">전체 '+bk.c+'장 중 '+readChs.length+'장</div>'
      +'<div class="progress-bar-bg" style="margin-bottom:12px"><div class="progress-bar-fill" style="width:'+rp+'%;background:'+co.a+'"></div></div>'
      +'<div style="font-size:12.5px;color:var(--brand2);background:var(--brand-soft);padding:11px 14px;border-radius:13px;margin-bottom:14px;font-weight:600;display:flex;align-items:center;gap:7px">'+ico('book',15)+' '+rangeStr+'</div>'
      +'<div class="chapter-grid">'+chs+'</div></div>'
      +'<div id="yeorinBible"></div>'
      +'<button class="btn-dashed" style="border-color:var(--green);color:var(--green)" onclick="askYeorinBibleUI(\''+bk.n+'\')"><img class="yeorin-img" src="'+YIMG+'"> 여린이에게 물어보기</button>';
  }

  let cats='';
  CATS.forEach(function(cat){
    const bks=BIBLE.map(function(b,i){return Object.assign({},b,{idx:i});}).filter(function(b){return b.cat===cat;});
    if(!bks.length)return;
    const co=CC[cat];
    let tiles='';
    bks.forEach(function(bk){
      let br=0;
      for(let i=0;i<bk.c;i++)if(bpSet.has(bk.idx+'-'+i))br++;
      const p=Math.round(br/bk.c*100);
      tiles+='<button class="book-tile" onclick="selBook='+bk.idx+';renderBible()" style="background:'+(p===100?co.a:p>0?co.bg:'#F8F5F0')+';color:'+(p===100?'#fff':co.t)+';font-weight:'+(p>0?600:400)+'">'+bk.n+(p>0?' '+br+'/'+bk.c:'')+(p===100?' '+ico('check',11)+'':'')+(p>0&&p<100?'<div class="micro-bar" style="width:'+p+'%;background:'+co.a+'"></div>':'')+'</button>';
    });
    cats+='<div class="cat-group"><div class="cat-label" style="color:'+co.t+'">'+cat+'</div><div class="book-grid">'+tiles+'</div></div>';
  });
  return cats;
}

// 연속으로 여러 장을 체크해도 요청이 하나씩 줄서지 않도록
// 1초 동안 모았다가 한 번에 보냅니다.
function toggleCh(bi,ch){
  const k=bi+'-'+ch;
  const bp=AD.myBibleProgress;
  const abp=AD.allBibleProgress;
  const wasChecked=bp.indexOf(k)>-1;

  // 화면 먼저 반영
  if(wasChecked){
    const idxs=[];
    bp.forEach(function(v,i){if(v===k)idxs.push(i);});
    for(let i=idxs.length-1;i>=0;i--)bp.splice(idxs[i],1);
    if(abp[CU.id]){
      const ai=[];
      abp[CU.id].forEach(function(v,i){if(v===k)ai.push(i);});
      for(let i=ai.length-1;i>=0;i--)abp[CU.id].splice(ai[i],1);
    }
  }else{
    bp.push(k);
    if(!abp[CU.id])abp[CU.id]=[];
    abp[CU.id].push(k);
  }

  // 같은 장을 여러 번 눌러도 최종 상태만 큐에 남음
  _bibleQueue[k]=!wasChecked;
  savingChapters[k]=true;
  renderBible();

  if(_bibleTimer)clearTimeout(_bibleTimer);
  _bibleTimer=setTimeout(flushBibleQueue,1000);
}

async function flushBibleQueue(){
  _bibleTimer=null;
  const keys=Object.keys(_bibleQueue);
  if(!keys.length)return;

  const items=keys.map(function(k){return{key:k,checked:_bibleQueue[k]};});
  const sent=Object.assign({},_bibleQueue);
  _bibleQueue={};

  showToast('저장 중...');
  try{
    await gas('toggleBibleChapters',CU.id,items);
    keys.forEach(function(k){delete savingChapters[k];});
    showToast('저장됨','success');
    renderBible();
  }catch(e){
    const bp=AD.myBibleProgress;
    const abp=AD.allBibleProgress;
    keys.forEach(function(k){
      delete savingChapters[k];
      if(sent[k]){
        // 추가하려던 것 → 화면에서 제거
        let i=bp.indexOf(k);
        while(i>-1){bp.splice(i,1);i=bp.indexOf(k);}
        if(abp[CU.id]){
          let j=abp[CU.id].indexOf(k);
          while(j>-1){abp[CU.id].splice(j,1);j=abp[CU.id].indexOf(k);}
        }
      }else{
        // 지우려던 것 → 되살리기
        if(bp.indexOf(k)===-1)bp.push(k);
        if(!abp[CU.id])abp[CU.id]=[];
        if(abp[CU.id].indexOf(k)===-1)abp[CU.id].push(k);
      }
    });
    showToast('저장 실패, 다시 시도해주세요','error');
    renderBible();
  }
}

async function deleteCh(id){

  const certBackup=AD.challengeCerts.filter(function(c){return c.challengeId===id;});
  AD.challenges=AD.challenges.filter(function(c){return c.id!==id;});

async function completeCh(id){

function renderCalendar(){

  const dim=new Date(cy,cm+1,0).getDate();
  const ts=td();

    return '<div style="color:'+(i===0?'var(--coral)':i===6?'var(--blue)':'var(--b5)')+'">'+d+'</div>';
  }).join('');

  let cells='';
  for(let i=0;i<fd_;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const ds=ms+'-'+pd(d);

// 시간 선택 위젯
function _tpParse(hhmm){
  if(!hhmm||!/^\d{1,2}:\d{1,2}$/.test(hhmm))return{ampm:'am',h12:9,m:0};
  const parts=hhmm.split(':');
  let h=parseInt(parts[0])||0;
  const m=parseInt(parts[1])||0;
  const ampm=h>=12?'pm':'am';
  let h12=h%12;
  if(h12===0)h12=12;
  return{ampm:ampm,h12:h12,m:m};
}

function _tpFormat(ampm,h12,m){
  let h24=h12;
  if(ampm==='am'&&h12===12)h24=0;
  else if(ampm==='pm'&&h12!==12)h24=h12+12;
  return pd(h24)+':'+pd(m);
}

function renderTimePicker(id,value){
  const p=_tpParse(value);
  return '<div class="tp-wrap" id="tp-'+id+'" data-ampm="'+p.ampm+'">'
    +'<div class="tp-row">'
    +'<div class="tp-ampm">'
    +'<button type="button" class="'+(p.ampm==='am'?'active':'')+'" onclick="tpSetAmpm(\''+id+'\',\'am\')">오전</button>'
    +'<button type="button" class="'+(p.ampm==='pm'?'active':'')+'" onclick="tpSetAmpm(\''+id+'\',\'pm\')">오후</button>'
    +'</div>'
    +'<div class="tp-num">'
    +'<input type="number" min="1" max="12" id="tph-'+id+'" value="'+p.h12+'" oninput="tpNormalizeH(\''+id+'\')">'
    +'<div class="tp-arrows">'
    +'<button type="button" onclick="tpIncHour(\''+id+'\')">▲</button>'
    +'<button type="button" onclick="tpDecHour(\''+id+'\')">▼</button>'
    +'</div>'
    +'</div>'
    +'<div class="tp-label">시</div>'
    +'<div class="tp-num">'
    +'<input type="number" min="0" max="59" id="tpm-'+id+'" value="'+pd(p.m)+'" oninput="tpNormalizeM(\''+id+'\')">'
    +'<div class="tp-arrows">'
    +'<button type="button" onclick="tpIncMin(\''+id+'\')">▲</button>'
    +'<button type="button" onclick="tpDecMin(\''+id+'\')">▼</button>'
    +'</div>'
    +'</div>'
    +'<div class="tp-label">분</div>'
    +'</div>'
    +'<div class="tp-quick">'
    +'<button type="button" class="tp-now" onclick="tpSetNow(\''+id+'\')">지금</button>'
    +'<button type="button" onclick="tpSetQuick(\''+id+'\',\'09:00\')">9시</button>'
    +'<button type="button" onclick="tpSetQuick(\''+id+'\',\'11:00\')">11시</button>'
    +'<button type="button" onclick="tpSetQuick(\''+id+'\',\'14:00\')">14시</button>'
    +'<button type="button" onclick="tpSetQuick(\''+id+'\',\'19:30\')">19:30</button>'
    +'</div>'
    +'</div>';
}

function tpGetValue(id){
  const wrap=document.getElementById('tp-'+id);
  if(!wrap)return'';
  const ampm=wrap.getAttribute('data-ampm')||'am';
  const h12=parseInt(document.getElementById('tph-'+id).value)||12;
  const m=parseInt(document.getElementById('tpm-'+id).value)||0;
  return _tpFormat(ampm,Math.min(12,Math.max(1,h12)),Math.min(59,Math.max(0,m)));
}

function tpSetAmpm(id,ampm){
  const wrap=document.getElementById('tp-'+id);
  if(!wrap)return;
  wrap.setAttribute('data-ampm',ampm);
  wrap.querySelectorAll('.tp-ampm button').forEach(function(b){b.classList.remove('active');});
  wrap.querySelector('.tp-ampm button[onclick*="\''+ampm+'\'"]').classList.add('active');
}

function tpIncHour(id){
  const el=document.getElementById('tph-'+id);
  let h=parseInt(el.value)||1;
  h=h>=12?1:h+1;
  el.value=h;
}
function tpDecHour(id){
  const el=document.getElementById('tph-'+id);
  let h=parseInt(el.value)||1;
  h=h<=1?12:h-1;
  el.value=h;
}

function tpIncMin(id){
  const el=document.getElementById('tpm-'+id);
  let m=parseInt(el.value)||0;
  m=Math.floor(m/5)*5+5;
  if(m>=60)m=0;
  el.value=pd(m);
}
function tpDecMin(id){
  const el=document.getElementById('tpm-'+id);
  let m=parseInt(el.value)||0;
  m=m<=0?55:(Math.ceil(m/5)*5-5);
  if(m<0)m=55;
  el.value=pd(m);
}

function tpNormalizeH(id){
  const el=document.getElementById('tph-'+id);
  let h=parseInt(el.value);
  if(isNaN(h))return;
  if(h<1)el.value=1;
  else if(h>12)el.value=12;
}
function tpNormalizeM(id){
  const el=document.getElementById('tpm-'+id);
  let m=parseInt(el.value);
  if(isNaN(m))return;
  if(m<0)el.value=0;
  else if(m>59)el.value=59;
}

function tpSetQuick(id,hhmm){
  const p=_tpParse(hhmm);
  const wrap=document.getElementById('tp-'+id);
  if(!wrap)return;
  wrap.setAttribute('data-ampm',p.ampm);
  wrap.querySelectorAll('.tp-ampm button').forEach(function(b){b.classList.remove('active');});
  wrap.querySelector('.tp-ampm button[onclick*="\''+p.ampm+'\'"]').classList.add('active');
  document.getElementById('tph-'+id).value=p.h12;
  document.getElementById('tpm-'+id).value=pd(p.m);
}

function tpSetNow(id){
  const n=new Date();
  const hh=pd(n.getHours());
  const mm=pd(n.getMinutes());
  tpSetQuick(id,hh+':'+mm);
}

// 기능:
// - 가나다 그룹핑 + 검색 + 직분 필터
// - 추가/수정/삭제 (누구나)

const ROLE_LIST=['담임','부담임','전도사','집사','권사','장로','성도','새가족','어린이','청년'];

// ===== 한글 초성 추출 =====
function getInitial(name){
  if(!name)return'#';
  const ch=String(name).charAt(0);
  const code=ch.charCodeAt(0);
  // 한글 음절 영역: 0xAC00 ~ 0xD7A3
  if(code>=0xAC00&&code<=0xD7A3){
    const initials=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    const idx=Math.floor((code-0xAC00)/588);
    let i=initials[idx];
    // 쌍자음을 단자음으로 통합
    if(i==='ㄲ')i='ㄱ';
    if(i==='ㄸ')i='ㄷ';
    if(i==='ㅃ')i='ㅂ';
    if(i==='ㅆ')i='ㅅ';
    if(i==='ㅉ')i='ㅈ';
    return i;
  }
  // 한글 자음 자체
  if(code>=0x3131&&code<=0x314E)return ch;
  // 영문
  if(/[a-zA-Z]/.test(ch))return ch.toUpperCase();
  return'#';
}

// ===== 가나다 정렬용 키 =====
function sortKey(name){
  return String(name||'').normalize('NFC');
}

// ===== 한글 초성 + 일반 검색 =====
function matchesSearch(contact,query){
  if(!query)return true;
  const q=String(query).toLowerCase().trim();
  if(!q)return true;
  const name=String(contact.name||'').toLowerCase();
  const phone=String(contact.phone||'').replace(/[-\s]/g,'');
  const phoneQ=q.replace(/[-\s]/g,'');
  if(name.includes(q))return true;
  if(phoneQ&&phone.includes(phoneQ))return true;
  // 초성 검색 (간단)
  if(/^[ㄱ-ㅎ]+$/.test(q)){
    let initials='';
    for(let i=0;i<contact.name.length;i++){
      initials+=getInitial(contact.name.charAt(i));
    }
    if(initials.includes(q))return true;
  }
  return false;
}

function renderAddressBook(){
  const el=document.getElementById('page-addressbook');
  if(!AD||AD.contacts===null){el.innerHTML=loadingView('mypage','주소록을 불러오고 있어요');return;}

  // 상세 페이지 모드
  if(selContactId){
    renderContactDetail();
    return;
  }

  const contacts=AD.contacts||[];

  // 필터링
  let filtered=contacts.filter(function(c){
    if(abRoleFilter!=='all'&&c.role!==abRoleFilter)return false;
    if(!matchesSearch(c,abSearch))return false;
    return true;
  });

  // 가나다 정렬
  filtered.sort(function(a,b){return sortKey(a.name).localeCompare(sortKey(b.name),'ko');});

  // 헤더
  let html=(filtered.length!==contacts.length
      ?'<div style="font-size:12.5px;color:var(--ink3);font-weight:600;margin-bottom:10px;padding:0 2px">검색 결과 '+filtered.length+'명</div>'
      :'');

  // 검색바
  html+='<div class="ab-search-wrap">'
    +'<span class="ab-search-icon">'+ico('search',16)+'</span>'
    +'<input class="ab-search" id="abSearchInput" placeholder="이름·전화·초성 검색 (예: ㅎㅁㅎ)" value="'+escapeHtml(abSearch)+'" oninput="onAbSearchInput(this.value)">'
    +'<button class="ab-search-clear'+(abSearch?' show':'')+'" onclick="clearAbSearch()">'+ico('close',13)+'</button>'
    +'</div>';

  // 직분 필터
  html+='<div class="ab-role-tabs">'
    +'<button class="ab-role-tab'+(abRoleFilter==='all'?' active':'')+'" onclick="setAbRoleFilter(\'all\')">전체</button>';
  // 실제 데이터에 있는 직분만 표시 (불필요한 빈 탭 방지)
  const usedRoles=ROLE_LIST.filter(function(r){
    return contacts.some(function(c){return c.role===r;});
  });
  // 데이터에 있지만 ROLE_LIST에 없는 커스텀 직분도 추가
  contacts.forEach(function(c){
    if(c.role&&ROLE_LIST.indexOf(c.role)===-1&&usedRoles.indexOf(c.role)===-1){
      usedRoles.push(c.role);
    }
  });
  usedRoles.forEach(function(r){
    html+='<button class="ab-role-tab'+(abRoleFilter===r?' active':'')+'" onclick="setAbRoleFilter(\''+escapeHtml(r)+'\')">'+escapeHtml(r)+'</button>';
  });
  html+='</div>';

  // 가나다 그룹핑 후 렌더
  if(filtered.length===0){
    if(contacts.length===0){
      html+='<div class="ab-empty">'+ico('contacts',40,'var(--line2)')+'<br><br>아직 등록된 연락처가 없어요<br>오른쪽 아래 + 버튼으로 추가해보세요</div>';
    }else{
      html+='<div class="ab-empty">검색 결과가 없어요</div>';
    }
  }else{
    const grouped={};
    filtered.forEach(function(c){
      const k=getInitial(c.name);
      if(!grouped[k])grouped[k]=[];
      grouped[k].push(c);
    });
    // 그룹 정렬 (한글 → 영문 → #)
    const groupKeys=Object.keys(grouped).sort(function(a,b){
      const aIsHan=/[ㄱ-ㅎ]/.test(a);
      const bIsHan=/[ㄱ-ㅎ]/.test(b);
      if(aIsHan&&!bIsHan)return-1;
      if(!aIsHan&&bIsHan)return 1;
      if(a==='#')return 1;
      if(b==='#')return-1;
      return a.localeCompare(b,'ko');
    });

    groupKeys.forEach(function(k){
      html+='<div class="ab-section"><div class="ab-section-hdr">'+k+'</div>';
      grouped[k].forEach(function(c){
        const initial=String(c.name||'?').charAt(0);
        html+='<div class="ab-card" onclick="openContact(\''+c.id+'\')">'
          +'<div class="ab-card-avatar">'+escapeHtml(initial)+'</div>'
          +'<div class="ab-card-body">'
          +'<div class="ab-card-name">'+escapeHtml(c.name||'')
          +(c.role?'<span class="ab-card-role">'+escapeHtml(c.role)+'</span>':'')
          +'</div>'
          +(c.phone?'<div class="ab-card-phone">'+escapeHtml(formatPhone(c.phone))+'</div>':'')
          +'</div>'
          +'<div class="ab-card-arrow">›</div>'
          +'</div>';
      });
      html+='</div>';
    });
  }

  // 플로팅 추가 버튼
  html+='<button class="ab-fab" onclick="showContactForm()" title="연락처 추가">'+ico('plus',24,'#fff')+'</button>';

  el.innerHTML=html;
}

// ===== 전화번호 앞자리 0 복원 =====
function normalizePhone(phone){
  const d=String(phone||'').replace(/[^\d]/g,'');
  if(!d)return'';
  if(d.charAt(0)!=='0'&&(d.length===9||d.length===10))return'0'+d;
  return d;
}
// ===== 전화번호 포맷 =====
function formatPhone(phone){
  if(!phone)return'';
  const d=normalizePhone(phone);
  if(d.length===11)return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
  if(d.length===10){
    if(d.startsWith('02'))return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6);
    return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  }
  if(d.length===9)return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
  return phone;
}

    +'<div class="ab-detail-name">'+escapeHtml(c.name||'')+'</div>'
    +(c.role?'<div class="ab-detail-role">'+escapeHtml(c.role)+'</div>':'')
    +'</div>';

  // 액션 버튼
  html+='<div class="ab-action-row">'
    +(phoneDigits
      ?'<a class="ab-action-btn primary" href="tel:'+escapeHtml(phoneDigits)+'"><span class="ab-act-icon">'+ico('phone',19)+'</span>전화</a>'
      :'<button class="ab-action-btn disabled"><span class="ab-act-icon">'+ico('phone',19)+'</span>전화</button>')
    +(phoneDigits
      ?'<a class="ab-action-btn" href="sms:'+escapeHtml(phoneDigits)+'"><span class="ab-act-icon">'+ico('message',19)+'</span>문자</a>'
      :'<button class="ab-action-btn disabled"><span class="ab-act-icon">'+ico('message',19)+'</span>문자</button>')
    +(c.email
      ?'<a class="ab-action-btn" href="mailto:'+escapeHtml(c.email)+'"><span class="ab-act-icon">'+ico('mail',19)+'</span>메일</a>'
      :'<button class="ab-action-btn disabled"><span class="ab-act-icon">'+ico('mail',19)+'</span>메일</button>')
    +'<button class="ab-action-btn" onclick="downloadVCard(\''+c.id+'\')"><span class="ab-act-icon">'+ico('save',19)+'</span>저장</button>'
    +'</div>';

  // 정보 카드
  html+='<div class="card">';
  html+=infoRow('phone','전화',phoneFmt,phoneDigits?'tel:'+phoneDigits:'');
  html+=infoRow('cake','생일',bdDisplay,'');
  html+=infoRow('family','가족관계',c.family,'');
  html+=infoRow('mapPin','주소',c.address,c.address?'https://map.kakao.com/?q='+encodeURIComponent(c.address):'');
  html+=infoRow('mail','이메일',c.email,c.email?'mailto:'+c.email:'');
  html+=infoRow('note','메모',c.memo,'');
  html+='</div>';

  // 수정/삭제 버튼
  html+='<div class="ab-edit-btns">'
    +'<button class="ab-btn-edit" onclick="showContactForm(\''+c.id+'\')">'+ico('edit',15)+' 수정</button>'
    +'<button class="ab-btn-del" onclick="confirmDeleteContact(\''+c.id+'\')">'+ico('trash',15)+' 삭제</button>'
    +'</div>';

  el.innerHTML=html;
}

function infoRow(icon,label,value,linkUrl){
  const has=value&&String(value).trim();
  const cls='ab-info-row'+(has?'':' ab-info-empty');
  const valHtml=has
    ?(linkUrl
      ?'<a href="'+escapeHtml(linkUrl)+'"'+(linkUrl.startsWith('http')?' target="_blank"':'')+' style="color:var(--b7);text-decoration:none">'+escapeHtml(value)+'</a>'
      :escapeHtml(value))
    :'정보 없음';
  return '<div class="'+cls+'">'
    +'<div class="ab-info-icon">'+(ICO[icon]?ico(icon,17):icon)+'</div>'
    +'<div class="ab-info-body">'
    +'<div class="ab-info-label">'+label+'</div>'
    +'<div class="ab-info-value">'+valHtml+'</div>'
    +'</div></div>';
}

function closeContact(){
  selContactId=null;
  renderAddressBook();
}

// ===== 추가/수정 폼 =====
function showContactForm(editId){
  const isEdit=!!editId;
  const c=isEdit?(AD.contacts||[]).find(function(x){return x.id===editId;}):null;
  if(isEdit&&!c){showToast('연락처를 찾을 수 없어요','error');return;}

  const cur=c||{name:'',phone:'',birthday:'',birthdayType:'solar',role:'',family:'',address:'',email:'',memo:''};

  // 직분 옵션 (기본 + 데이터에 있는 커스텀)
  const allRoles=ROLE_LIST.slice();
  (AD.contacts||[]).forEach(function(ct){
    if(ct.role&&allRoles.indexOf(ct.role)===-1)allRoles.push(ct.role);
  });
  const roleOpts='<option value="">선택 안 함</option>'+allRoles.map(function(r){
    return '<option value="'+escapeHtml(r)+'"'+(cur.role===r?' selected':'')+'>'+escapeHtml(r)+'</option>';
  }).join('')+'<option value="__custom__">+ 직접 입력</option>';

  showPopup('<button class="popup-close" onclick="closePopup()">'+ico('close',14)+'</button>'
    +'<h3>'+(isEdit?'연락처 수정':'연락처 추가')+'</h3>'
    +'<input type="hidden" id="cfId" value="'+(editId||'')+'">'
    +'<div class="fg"><label class="q-label">이름 <span style="color:var(--coral)">*</span></label><input class="input-field" id="cfName" value="'+escapeHtml(cur.name)+'" placeholder="홍길동"></div>'
    +'<div class="fg"><label class="q-label">전화번호</label><input class="input-field" id="cfPhone" value="'+escapeHtml(cur.phone)+'" placeholder="010-1234-5678" type="tel"></div>'
    +'<div class="fg"><label class="q-label">생일</label>'
    +'<input type="date" class="input-field" id="cfBirthday" value="'+escapeHtml(cur.birthday)+'">'
    +'<div class="bd-type-row">'
    +'<button type="button" class="'+(cur.birthdayType!=='lunar'?'active':'')+'" onclick="setBdType(\'solar\')" id="bdSolar">양력</button>'
    +'<button type="button" class="'+(cur.birthdayType==='lunar'?'active':'')+'" onclick="setBdType(\'lunar\')" id="bdLunar">음력</button>'
    +'</div>'
    +'<input type="hidden" id="cfBirthdayType" value="'+(cur.birthdayType||'solar')+'">'
    +'</div>'
    +'<div class="fg"><label class="q-label">직분</label>'
    +'<select class="select-field" id="cfRole" onchange="onRoleChange()">'+roleOpts+'</select>'
    +'<div id="cfRoleCustomWrap" style="display:none;margin-top:6px"><input class="input-field" id="cfRoleCustom" placeholder="직분 직접 입력"></div>'
    +'</div>'
    +'<div class="fg"><label class="q-label">가족관계</label><input class="input-field" id="cfFamily" value="'+escapeHtml(cur.family)+'" placeholder="배우자 ○○○, 자녀 △△△"></div>'
    +'<div class="fg"><label class="q-label">주소</label><input class="input-field" id="cfAddress" value="'+escapeHtml(cur.address)+'" placeholder="서울시 강남구 ..."></div>'
    +'<div class="fg"><label class="q-label">이메일</label><input class="input-field" id="cfEmail" value="'+escapeHtml(cur.email)+'" type="email" placeholder="example@email.com"></div>'
    +'<div class="fg"><label class="q-label">메모</label><textarea class="input-field" id="cfMemo" rows="3" style="resize:none" placeholder="특이사항 (선택)">'+escapeHtml(cur.memo)+'</textarea></div>'
    +'<button class="btn-primary" id="cfSubmitBtn" onclick="submitContactForm()">'+(isEdit?'저장':'추가')+'</button>');
}

function setBdType(type){
  document.getElementById('cfBirthdayType').value=type;
  document.getElementById('bdSolar').classList.toggle('active',type==='solar');
  document.getElementById('bdLunar').classList.toggle('active',type==='lunar');
}

function onRoleChange(){
  const sel=document.getElementById('cfRole');
  const wrap=document.getElementById('cfRoleCustomWrap');
  if(sel.value==='__custom__'){
    wrap.style.display='block';
    document.getElementById('cfRoleCustom').focus();
  }else{
    wrap.style.display='none';
  }
}

async function submitContactForm(){
  const id=document.getElementById('cfId').value;
  const name=document.getElementById('cfName').value.trim();
  const phone=document.getElementById('cfPhone').value.trim();
  const birthday=document.getElementById('cfBirthday').value;
  const birthdayType=document.getElementById('cfBirthdayType').value||'solar';
  let role=document.getElementById('cfRole').value;
  if(role==='__custom__'){
    const custom=document.getElementById('cfRoleCustom').value.trim();
    role=custom;
  }
  const family=document.getElementById('cfFamily').value.trim();
  const address=document.getElementById('cfAddress').value.trim();
  const email=document.getElementById('cfEmail').value.trim();
  const memo=document.getElementById('cfMemo').value.trim();

  if(!name){showToast('이름을 입력해주세요','error');return;}

  const btn=document.getElementById('cfSubmitBtn');
  if(btn){btn.disabled=true;btn.textContent=id?'저장 중...':'추가 중...';}

  if(id){
    // 수정
    const target=(AD.contacts||[]).find(function(x){return x.id===id;});
    if(!target){closePopup();return;}
    const backup=Object.assign({},target);
    Object.assign(target,{name:name,phone:phone,birthday:birthday,birthdayType:birthdayType,role:role,family:family,address:address,email:email,memo:memo});
    closePopup();
    selContactId?renderContactDetail():renderAddressBook();
    showToast('저장 중...');
    try{
      await gas('updateContact',id,name,phone,birthday,birthdayType,role,family,address,email,memo);
      showToast('저장 완료','success');
    }catch(e){
      Object.assign(target,backup);
      showToast('저장 실패','error');
      selContactId?renderContactDetail():renderAddressBook();
    }
  }else{
    // 추가
    const tempId='temp_'+Date.now();
    const tempContact={id:tempId,name:name,phone:phone,birthday:birthday,birthdayType:birthdayType,role:role,family:family,address:address,email:email,memo:memo,createdBy:CU.id,_pending:true};
    if(!AD.contacts)AD.contacts=[];
    AD.contacts.push(tempContact);
    closePopup();
    renderAddressBook();
    showToast('추가 중...');
    try{
      const r=await gas('addContact',CU.id,name,phone,birthday,birthdayType,role,family,address,email,memo);
      const idx=AD.contacts.findIndex(function(x){return x.id===tempId;});
      if(idx>=0&&r&&r.id){
        AD.contacts[idx].id=r.id;
        delete AD.contacts[idx]._pending;
      }
      showToast('연락처 추가 완료','success');
      renderAddressBook();
    }catch(e){
      AD.contacts=AD.contacts.filter(function(x){return x.id!==tempId;});
      showToast('추가 실패','error');
      renderAddressBook();
    }
  }
}

// ===== 삭제 =====
function confirmDeleteContact(id){
  const c=(AD.contacts||[]).find(function(x){return x.id===id;});
  if(!c)return;
  if(!confirm('"'+c.name+'" 연락처를 삭제할까요?\n이 동작은 되돌릴 수 없어요.'))return;
  doDeleteContact(id);
}

async function doDeleteContact(id){
  const idx=(AD.contacts||[]).findIndex(function(x){return x.id===id;});
  if(idx<0)return;
  const backup=AD.contacts[idx];
  AD.contacts.splice(idx,1);
  selContactId=null;
  renderAddressBook();
  showToast('삭제 중...');
  try{
    await gas('deleteContact',id,CU.id);
    showToast('삭제 완료','success');
  }catch(e){
    AD.contacts.push(backup);
    showToast('삭제 실패','error');
    renderAddressBook();
  }
}

// ===== vCard 다운로드 (스마트폰 연락처에 저장) =====
function downloadVCard(id){
  const c=(AD.contacts||[]).find(function(x){return x.id===id;});
  if(!c){showToast('연락처를 찾을 수 없어요','error');return;}

  // vCard 3.0 포맷
  const lines=['BEGIN:VCARD','VERSION:3.0'];
  // 이름 (FN: 풀네임, N: 성;이름 - 한국 이름은 그냥 통째로)
  lines.push('FN:'+vcEscape(c.name));
  lines.push('N:'+vcEscape(c.name)+';;;;');
  if(c.phone)lines.push('TEL;TYPE=CELL:'+vcEscape(String(c.phone).replace(/[-\s]/g,'')));
  if(c.email)lines.push('EMAIL:'+vcEscape(c.email));
  if(c.address)lines.push('ADR;TYPE=HOME:;;'+vcEscape(c.address)+';;;;');
  if(c.birthday)lines.push('BDAY:'+vcEscape(c.birthday));
  // 메모: 직분 + 가족관계 + 메모 합치기
  const noteParts=[];
  if(c.role)noteParts.push('[직분] '+c.role);
  if(c.family)noteParts.push('[가족] '+c.family);
  if(c.birthday&&c.birthdayType==='lunar')noteParts.push('(생일: 음력 '+c.birthday+')');
  if(c.memo)noteParts.push(c.memo);
  noteParts.push('— 여린교회 주소록');
  if(noteParts.length)lines.push('NOTE:'+vcEscape(noteParts.join('\\n')));
  // 조직
  lines.push('ORG:여린교회');
  if(c.role)lines.push('TITLE:'+vcEscape(c.role));
  lines.push('END:VCARD');

  const vcard=lines.join('\r\n');
  const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=(c.name||'contact')+'.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
  showToast('연락처 파일을 받아 열어주세요','success');
}

function vcEscape(s){
  return String(s||'').replace(/\\/g,'\\\\').replace(/,/g,'\\,').replace(/;/g,'\\;').replace(/\n/g,'\\n');
}
